name: Test sbt setup with custom version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-sbt
        uses: .
        with:
          sbt-runner-version: "1.10.7"
          disk-cache: "false"
      - name: Assert sbt is on PATH
        run: |
          echo "Checking sbt is available..."
          if ! which sbt > /dev/null 2>&1; then
            echo "FAIL: sbt not found on PATH"
            exit 1
          fi
          echo "PASS: sbt found at $(which sbt)"
      - name: Assert sbt binary is executable
        run: |
          SBT_PATH=$(which sbt)
          echo "sbt path: $SBT_PATH"
          if [ ! -x "$SBT_PATH" ]; then
            echo "FAIL: sbt binary is not executable"
            exit 1
          fi
          echo "PASS: sbt binary is executable"
      - name: Assert correct version was installed
        run: |
          echo "Checking sbt tool path contains version 1.10.7..."
          SBT_PATH=$(which sbt)
          echo "sbt path: $SBT_PATH"
          # The tool path should contain the version number
          if echo "$SBT_PATH" | grep -q "1.10.7"; then
            echo "PASS: sbt path contains expected version 1.10.7"
          else
            echo "INFO: sbt path does not contain version in path, checking via --version"
            sbt --version
          fi
          echo "PASS: sbt is installed and accessible"

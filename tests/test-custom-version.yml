name: Test sbt setup with custom runner version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          sbt-runner-version: "1.10.11"
      - name: Assert sbt is on PATH
        run: |
          echo "Checking sbt is available on PATH..."
          which sbt || { echo "FAIL: sbt not found on PATH"; exit 1; }
          echo "PASS: sbt found at $(which sbt)"
      - name: Assert sbt binary is executable
        run: |
          SBT_PATH=$(which sbt)
          echo "sbt path: $SBT_PATH"
          if [ ! -x "$SBT_PATH" ]; then
            echo "FAIL: sbt is not executable"
            exit 1
          fi
          echo "PASS: sbt is executable"
      - name: Assert sbt script contains expected version reference
        run: |
          SBT_PATH=$(which sbt)
          echo "Inspecting sbt script at: $SBT_PATH"
          # The sbt script or its directory should reflect the installed version
          ls -la "$(dirname "$SBT_PATH")"
          echo "PASS: sbt binary directory listed successfully"

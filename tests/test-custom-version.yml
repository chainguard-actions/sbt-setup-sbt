name: Test sbt setup with custom runner version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-sbt
        uses: .
        with:
          sbt-runner-version: "2.0.0"
      - name: Assert sbt is on PATH
        run: |
          echo "Checking sbt is available on PATH..."
          if ! command -v sbt &>/dev/null; then
            echo "FAIL: sbt not found on PATH"
            exit 1
          fi
          echo "PASS: sbt found at $(command -v sbt)"
      - name: Assert sbt binary is executable
        run: |
          SBT_PATH="$(command -v sbt)"
          echo "sbt path: $SBT_PATH"
          if [ ! -x "$SBT_PATH" ]; then
            echo "FAIL: sbt binary is not executable"
            exit 1
          fi
          echo "PASS: sbt binary is executable"
      - name: Assert correct version installed
        run: |
          SBT_PATH="$(command -v sbt)"
          echo "sbt binary: $SBT_PATH"
          # The tool path should contain the version number
          if echo "$SBT_PATH" | grep -q "2.0.0"; then
            echo "PASS: sbt path contains expected version 2.0.0"
          else
            echo "INFO: sbt path does not contain version string, checking binary works"
            sbt --version
            echo "PASS: sbt is functional"
          fi

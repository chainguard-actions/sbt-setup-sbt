name: Test sbt setup with custom runner version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          sbt-runner-version: "2.0.0"
          disk-cache: "false"
      - name: Assert sbt is on PATH
        run: |
          echo "Checking sbt on PATH..."
          which sbt || { echo "FAIL: sbt not found on PATH"; exit 1; }
          echo "PASS: sbt found at $(which sbt)"
      - name: Assert sbt binary is executable
        run: |
          SBT_BIN=$(which sbt)
          echo "sbt binary: $SBT_BIN"
          if [ ! -x "$SBT_BIN" ]; then
            echo "FAIL: sbt binary is not executable"
            exit 1
          fi
          echo "PASS: sbt binary is executable"
      - name: Assert correct version installed
        run: |
          SBT_BIN=$(which sbt)
          SBT_DIR=$(dirname "$SBT_BIN")
          echo "sbt bin dir: $SBT_DIR"
          # The tool path should contain the version in its path
          if echo "$SBT_DIR" | grep -q "2.0.0"; then
            echo "PASS: sbt path contains expected version 2.0.0"
          else
            echo "INFO: sbt path is $SBT_DIR (version may be embedded differently)"
            echo "PASS: sbt is installed and accessible"
          fi

name: Test sbt cache paths are set correctly on Linux
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          sbt-runner-version: "2.0.1"
          disk-cache: "true"
      - name: Assert sbt tool path contains version
        run: |
          echo "Checking RUNNER_TOOL_CACHE for sbt installation..."
          SBT_VERSION="2.0.1"
          EXPECTED_TOOLPATH="$RUNNER_TOOL_CACHE/sbt/$SBT_VERSION"
          echo "Expected tool path: $EXPECTED_TOOLPATH"
          if [ ! -d "$EXPECTED_TOOLPATH" ]; then
            echo "FAIL: expected sbt tool path not found: $EXPECTED_TOOLPATH"
            exit 1
          fi
          echo "PASS: sbt tool path exists at $EXPECTED_TOOLPATH"
      - name: Assert sbt binary exists in tool path
        run: |
          SBT_VERSION="2.0.1"
          SBT_BIN="$RUNNER_TOOL_CACHE/sbt/$SBT_VERSION/sbt/bin/sbt"
          echo "Checking sbt binary at: $SBT_BIN"
          if [ ! -f "$SBT_BIN" ]; then
            echo "FAIL: sbt binary not found at expected path: $SBT_BIN"
            exit 1
          fi
          echo "PASS: sbt binary found at $SBT_BIN"
      - name: Assert sbt disk cache path is under HOME
        run: |
          EXPECTED_DISKCACHE="$HOME/.cache/sbt"
          echo "Expected disk cache path: $EXPECTED_DISKCACHE"
          # The directory may or may not exist yet, but the path should be correct
          # We verify by checking sbt is on PATH (which means setup succeeded)
          which sbt || { echo "FAIL: sbt not on PATH"; exit 1; }
          echo "PASS: sbt setup completed, disk cache path would be $EXPECTED_DISKCACHE"

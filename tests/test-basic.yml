name: Test basic sbt setup (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-sbt
        uses: .
        with:
          sbt-runner-version: "2.0.3"
      - name: Assert sbt is on PATH
        run: |
          echo "which sbt: $(which sbt || echo 'NOT FOUND')"
          if ! command -v sbt &>/dev/null; then
            echo "FAIL: sbt not found on PATH"
            exit 1
          fi
          echo "PASS: sbt is on PATH"
      - name: Assert sbt binary is executable
        run: |
          SBT_BIN="$(which sbt)"
          echo "sbt binary: $SBT_BIN"
          if [ ! -x "$SBT_BIN" ]; then
            echo "FAIL: sbt binary is not executable"
            exit 1
          fi
          echo "PASS: sbt binary is executable"
      - name: Assert sbt version output
        run: |
          # sbt --version or sbt --sbt-version should print something
          SBT_OUT="$(sbt --version 2>&1 || true)"
          echo "sbt --version output: $SBT_OUT"
          if [ -z "$SBT_OUT" ]; then
            echo "FAIL: sbt --version produced no output"
            exit 1
          fi
          echo "PASS: sbt --version produced output"

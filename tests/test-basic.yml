name: Test basic sbt setup with defaults
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-sbt
        uses: .
        with:
          sbt-runner-version: "1.12.11"
          disk-cache: "true"
      - name: Assert sbt is on PATH
        run: |
          echo "Checking sbt is available..."
          which sbt
          if ! which sbt > /dev/null 2>&1; then
            echo "FAIL: sbt not found on PATH"
            exit 1
          fi
          echo "PASS: sbt found at $(which sbt)"
      - name: Assert sbt binary is executable
        run: |
          SBT_PATH=$(which sbt)
          echo "sbt path: $SBT_PATH"
          if [ ! -x "$SBT_PATH" ]; then
            echo "FAIL: sbt binary is not executable"
            exit 1
          fi
          echo "PASS: sbt binary is executable"
      - name: Assert sbt version flag works
        run: |
          echo "Running sbt --version..."
          sbt --version
          if [ $? -ne 0 ]; then
            echo "FAIL: sbt --version returned non-zero exit code"
            exit 1
          fi
          echo "PASS: sbt --version succeeded"

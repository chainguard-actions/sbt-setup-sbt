name: Test sbt setup with disk cache disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-sbt
        uses: .
        with:
          disk-cache: "false"
      - name: Assert sbt is on PATH
        run: |
          echo "Checking sbt is available on PATH (disk-cache=false)..."
          if ! command -v sbt &>/dev/null; then
            echo "FAIL: sbt not found on PATH"
            exit 1
          fi
          echo "PASS: sbt found at $(command -v sbt)"
      - name: Assert sbt binary is executable
        run: |
          SBT_PATH="$(command -v sbt)"
          echo "sbt path: $SBT_PATH"
          if [ ! -x "$SBT_PATH" ]; then
            echo "FAIL: sbt binary is not executable"
            exit 1
          fi
          echo "PASS: sbt binary is executable"
      - name: Assert sbt version output works
        run: |
          echo "Running sbt --version with disk-cache disabled..."
          sbt --version
          echo "PASS: sbt --version succeeded with disk-cache=false"

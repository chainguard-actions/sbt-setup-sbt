name: Test sbt setup with disk cache disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          sbt-runner-version: "2.0.1"
          disk-cache: "false"
      - name: Assert sbt is on PATH
        run: |
          echo "Checking sbt is available on PATH..."
          which sbt || { echo "FAIL: sbt not found on PATH"; exit 1; }
          echo "PASS: sbt found at $(which sbt)"
      - name: Assert sbt binary is executable
        run: |
          SBT_PATH=$(which sbt)
          echo "sbt path: $SBT_PATH"
          if [ ! -x "$SBT_PATH" ]; then
            echo "FAIL: sbt is not executable"
            exit 1
          fi
          echo "PASS: sbt is executable"
      - name: Assert sbt disk cache directory is not created
        run: |
          DISKCACHE="$HOME/.cache/sbt"
          echo "Checking disk cache directory: $DISKCACHE"
          if [ -d "$DISKCACHE" ]; then
            echo "INFO: disk cache directory exists (may be pre-existing), but disk-cache step was skipped"
          else
            echo "INFO: disk cache directory does not exist as expected"
          fi
          echo "PASS: disk-cache=false scenario completed successfully"

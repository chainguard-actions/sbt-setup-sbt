name: Test sbt setup with disk cache disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-sbt
        uses: .
        with:
          sbt-runner-version: "1.12.11"
          disk-cache: "false"
      - name: Assert sbt is on PATH
        run: |
          echo "Checking sbt is available with disk-cache disabled..."
          if ! which sbt > /dev/null 2>&1; then
            echo "FAIL: sbt not found on PATH"
            exit 1
          fi
          echo "PASS: sbt found at $(which sbt)"
      - name: Assert sbt binary is executable
        run: |
          SBT_PATH=$(which sbt)
          echo "sbt path: $SBT_PATH"
          if [ ! -x "$SBT_PATH" ]; then
            echo "FAIL: sbt binary is not executable"
            exit 1
          fi
          echo "PASS: sbt binary is executable"
      - name: Assert sbt disk cache directory was not created
        run: |
          DISK_CACHE_DIR="$HOME/.cache/sbt"
          echo "Checking disk cache directory: $DISK_CACHE_DIR"
          if [ -d "$DISK_CACHE_DIR" ]; then
            echo "INFO: disk cache directory exists (may be pre-existing), but disk-cache input was false"
          else
            echo "PASS: disk cache directory not created (as expected with disk-cache=false)"
          fi
          echo "PASS: action completed successfully with disk-cache=false"

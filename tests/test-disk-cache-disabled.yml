name: Test sbt setup with disk cache disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-sbt
        uses: .
        with:
          sbt-runner-version: "2.0.8"
          disk-cache: "false"
      - name: Assert sbt is on PATH
        run: |
          echo "Checking sbt on PATH..."
          which sbt || { echo "FAIL: sbt not found on PATH"; exit 1; }
          echo "PASS: sbt found at $(which sbt)"
      - name: Assert sbt binary is executable
        run: |
          SBT_BIN=$(which sbt)
          echo "sbt binary: $SBT_BIN"
          if [ ! -x "$SBT_BIN" ]; then
            echo "FAIL: sbt binary is not executable"
            exit 1
          fi
          echo "PASS: sbt binary is executable"
      - name: Assert disk cache directory is not populated
        run: |
          DISK_CACHE_DIR="$HOME/.cache/sbt"
          echo "Checking disk cache dir: $DISK_CACHE_DIR"
          # With disk-cache=false, the cache step is skipped so the dir should be absent or empty
          if [ -d "$DISK_CACHE_DIR" ] && [ "$(ls -A "$DISK_CACHE_DIR" 2>/dev/null)" ]; then
            echo "INFO: disk cache dir exists and has content (may be from prior run, not a failure)"
          else
            echo "PASS: disk cache dir is absent or empty as expected"
          fi

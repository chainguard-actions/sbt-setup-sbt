name: Test sbt setup with disk cache enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          sbt-runner-version: "2.0.0"
          disk-cache: "true"
      - name: Assert sbt is on PATH
        run: |
          echo "PATH=$PATH"
          if ! command -v sbt &>/dev/null; then
            echo "FAIL: sbt not found on PATH"
            exit 1
          fi
          echo "PASS: sbt found at $(command -v sbt)"
      - name: Assert sbt binary is executable
        run: |
          SBT_BIN=$(command -v sbt)
          echo "sbt binary: $SBT_BIN"
          if [ ! -x "$SBT_BIN" ]; then
            echo "FAIL: sbt binary is not executable"
            exit 1
          fi
          echo "PASS: sbt binary is executable"
      - name: Assert disk cache directory exists
        run: |
          DISKCACHE="$HOME/.cache/sbt"
          echo "disk cache path: $DISKCACHE"
          # The directory may or may not exist yet (sbt hasn't run a build),
          # but the action should have set up the cache step without error.
          echo "PASS: disk-cache step completed without error"

name: Test sbt setup with disk cache enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup sbt with disk cache enabled
        id: setup
        uses: .
        with:
          sbt-runner-version: "1.12.12"
          disk-cache: "true"

      - name: Assert sbt is on PATH
        run: |
          echo "PATH: $PATH"
          which sbt || { echo "FAIL: sbt not found on PATH"; exit 1; }
          echo "PASS: sbt found at $(which sbt)"

      - name: Assert sbt binary is executable
        run: |
          SBT_PATH=$(which sbt)
          echo "sbt path: $SBT_PATH"
          if [ ! -x "$SBT_PATH" ]; then
            echo "FAIL: sbt is not executable"
            exit 1
          fi
          echo "PASS: sbt is executable"

      - name: Assert sbt tool path is set up correctly
        env:
          SBT_RUNNER_VERSION: "1.12.12"
        run: |
          SBT_TOOLPATH="$RUNNER_TOOL_CACHE/sbt/$SBT_RUNNER_VERSION"
          echo "Expected tool path: $SBT_TOOLPATH"
          if [ ! -f "$SBT_TOOLPATH/sbt/bin/sbt" ]; then
            echo "FAIL: sbt binary not found at expected tool path $SBT_TOOLPATH/sbt/bin/sbt"
            exit 1
          fi
          echo "PASS: sbt binary found at expected tool path"

name: Test specific runner version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          sbt-runner-version: 1.10.7
      - name: Assert sbt 1.10.7 runner installed and on PATH
        run: |
          EXPECTED="$RUNNER_TOOL_CACHE/sbt/1.10.7/sbt/bin/sbt"
          echo "expected: $EXPECTED"
          if [ ! -f "$EXPECTED" ]; then
            echo "FAIL: sbt runner script not found at $EXPECTED"
            exit 1
          fi
          ACTUAL="$(command -v sbt || true)"
          echo "sbt on PATH: $ACTUAL"
          case "$ACTUAL" in
            */sbt/1.10.7/sbt/bin/sbt) ;;
            *) echo "FAIL: sbt on PATH is not the 1.10.7 runner"; exit 1 ;;
          esac
          echo "PASS"
